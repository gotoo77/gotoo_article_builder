<svg xmlns="http://www.w3.org/2000/svg"
     width="360"
     height="520"
     viewBox="0 0 360 520"
     role="img"
     aria-labelledby="title desc">
  <title id="title">{{ aria_title }}</title>
  <desc id="desc">{{ aria_desc }}</desc>

  <defs>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#paperShadow)">
    <rect x="10" y="10" width="340" height="500" rx="18"
          fill="{{ bg_color }}"
          stroke="{{ border_color }}"
          stroke-width="1.5"/>
    <rect x="18" y="18" width="324" height="484" rx="14"
          fill="none"
          stroke="{{ dash_color }}"
          stroke-width="2.2"
          stroke-dasharray="8 6"/>
  </g>

  <text x="180" y="54"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="800"
        letter-spacing="1.2"
        fill="{{ header_color }}">
    JETON N°{{ ticket_number }}
  </text>

  <g id="icon-area" transform="translate(180 132)">
{{ icon_svg }}
  </g>

  <g id="main-text"
     font-family="Impact, Arial Black, Arial, sans-serif"
     text-anchor="middle"
     fill="{{ main_text_color }}">
    <text x="180" y="246" font-size="{{ line_font_size_1 }}" font-weight="900" fill="{{ line1_color }}">{{ line1 }}</text>
    <text x="180" y="286" font-size="{{ line_font_size_2 }}" font-weight="900" fill="{{ line2_color }}">{{ line2 }}</text>
    <text x="180" y="326" font-size="{{ line_font_size_3 }}" font-weight="900" fill="{{ line3_color }}">{{ line3 }}</text>
    <text x="180" y="366" font-size="{{ line_font_size_4 }}" font-weight="900" fill="{{ line4_color }}">{{ line4 }}</text>
  </g>

  <g id="footer"
     font-family="Arial, Helvetica, sans-serif"
     text-anchor="middle"
     fill="{{ footer_color }}">
    <text x="180" y="430" font-size="15" font-weight="500">{{ footer_line1 }}</text>
    <text x="180" y="454" font-size="15" font-weight="500">{{ footer_line2 }}</text>
  </g>

  <text x="310" y="478"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="700"
        fill="{{ accent_color }}">{{ accent_glyph }}</text>
</svg>
